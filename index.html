<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- 🔹 Ícone -->
    <link rel="icon" type="image/png" href="/Design sem nome (40).png" />

    <!-- 🔹 Manifest PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- 🔹 Viewport travado + notch safe -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />

    <!-- 🔹 Descrição -->
    <meta
      name="description"
      content="Acrobatas Workforce - Plataforma de conexão entre profissionais e empresas da construção civil"
    />

    <!-- 🔹 Cor da barra do navegador (Android/iOS Safari) -->
    <meta name="theme-color" content="#1d4ed8" />

    <!-- 🔹 Ajuste extra para iPhone fullscreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Acrobatas Workforce" />

    <title>Acrobatas Workforce - Conectando Profissionais e Empresas</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;

        /* 👉 importante: altura dinâmica em vez de 100% */
        min-height: 100dvh;

        /* mesma cor do fundo base que colocámos no CSS global */
        background-color: #1d4ed8;

        overflow-x: hidden;
        overscroll-behavior-x: none;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        touch-action: pan-y;
        -webkit-text-size-adjust: 100%;
      }

      body {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* root ocupando a tela toda */
      #root {
        min-height: 100dvh;
        isolation: isolate;
        background-color: transparent; /* quem pinta é o React (gradients) */
      }

      /* Impede zoom automático em inputs < 16px */
      input,
      select,
      textarea,
      button {
        font-size: 16px !important;
      }
    </style>

    <!-- 🔒 Impede pinch e duplo toque no Safari -->
    <script>
      document.addEventListener(
        "gesturestart",
        (e) => e.preventDefault(),
        { passive: false }
      );
      document.addEventListener(
        "dblclick",
        (e) => e.preventDefault(),
        { passive: false }
      );
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- 🛡️ EDGE GUARD + trava de histórico no iOS -->
    <script>
      (function () {
        const isIOS = /iP(ad|hone|od)/.test(navigator.userAgent);

        const edge = document.createElement("div");
        edge.id = "edge-guard";
        Object.assign(edge.style, {
          position: "fixed",
          left: "0",
          top: "0",
          bottom: "0",
          width: "16px",
          zIndex: "9999",
          background: "transparent",
          pointerEvents: "auto",
          touchAction: "none",
        });
        document.body.appendChild(edge);

        let startX = 0;
        const onStart = (e) => {
          startX = e.touches[0].clientX;
        };
        const onMove = (e) => {
          if (startX < 16) e.preventDefault();
        };

        edge.addEventListener("touchstart", onStart, { passive: false });
        edge.addEventListener("touchmove", onMove, { passive: false });

        if (isIOS && "pushState" in history) {
          const relock = () => history.pushState(null, "", location.href);
          window.addEventListener("load", relock);
          window.addEventListener("popstate", relock);
          history.pushState(null, "", location.href);
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
